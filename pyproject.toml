[project]
name = "app"
version = "0.1.0"
description = "A Digital Asset Management focus on images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.11",
    "colorthief>=0.2.1",
    "crossfiledialog>=1.3.1",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "platformdirs>=4.13.5",
    "slint>=1.18.1b1",
    "tinydb>=4.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
