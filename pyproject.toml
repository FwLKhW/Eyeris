[project]
name = "eyeris"
version = "0.1.0"
description = "A Digital Asset Management focus on images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crossfiledialog>=1.3.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "platformdirs>=4.13.5",
    "polars>=2.1.0",
    "slint>=1.18.1b1",
    "tinydb>=4.9.0",
    "transformers>=5.22.1",
    "ultralytics>=8.4.194",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pyinstaller>=6.22.3",
]
